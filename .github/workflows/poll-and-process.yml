name: Poll and Process Dropbox Files

on:
  # schedule:
    # Run every minute during working hours (KST 08:00-19:00, UTC 23:00-10:00)
    # Excludes weekends (Saturday and Sunday)
  #   - cron: '0-59 23 * * 1-5'  # UTC 23:00-23:59 Mon-Fri (KST 08:00-08:59)
  #   - cron: '0-59 0-9 * * 1-5'  # UTC 00:00-09:59 Mon-Fri (KST 09:00-18:59)
  #   - cron: '0-59 10 * * 1-5'  # UTC 10:00-10:59 Mon-Fri (KST 19:00-19:59)
  workflow_dispatch:
    inputs:
      time_range:
        description: "Time range to process (e.g., 15m, 30m, 1h, 2h)"
        required: false
        default: "15m"
      dry_run:
        description: "Dry run mode (no actual file operations)"
        required: false
        default: "false"

env:
  POLL_AND_PROCESS_PAUSED: ${{ vars.POLL_AND_PROCESS_PAUSED || 'false' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.gate.outputs.continue }}
    steps:
      - name: Evaluate pause gate
        id: gate
        shell: bash
        env:
          POLL_AND_PROCESS_PAUSED: ${{ vars.POLL_AND_PROCESS_PAUSED }}
        run: |
          if [ "${POLL_AND_PROCESS_PAUSED}" = "true" ]; then
            echo "Workflow is paused via repo variable POLL_AND_PROCESS_PAUSED=true"
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "Workflow is active"
            echo "continue=true" >> $GITHUB_OUTPUT
          fi
  poll-and-process:
    needs: gate
    # Run only when gate allows
    if: ${{ needs.gate.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    env:
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_ADMIN_USER_ID: ${{ secrets.DROPBOX_ADMIN_USER_ID }}
      DROPBOX_TEMPLATE_ID: ${{ secrets.DROPBOX_TEMPLATE_ID }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WORKFLOW_SHARED_SECRET: ${{ secrets.WORKFLOW_SHARED_SECRET }}
      TIME_RANGE: ${{ github.event.inputs.time_range || '15m' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with dependency caching
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure PyQt5 is installed for GUI components (headless CI may still require platform libs)
          pip install PyQt5
          
      - name: Verify critical packages
        run: |
          echo "=== Verifying installed packages ==="
          python -c "import requests; print(f'✅ requests {requests.__version__}')"
          python -c "import dropbox; print(f'✅ dropbox {dropbox.__version__}')"
          python -c "import PIL; print(f'✅ Pillow {PIL.__version__}')"
          python -c "import PyQt5; print('✅ PyQt5 available')"
          echo "✅ All critical packages verified"
    
      - name: Create .env file
        run: |
          cat > .env << EOF
          DROPBOX_CLIENT_ID=${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET=${{ secrets.DROPBOX_CLIENT_SECRET }}
          DROPBOX_REFRESH_TOKEN=${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_ADMIN_USER_ID=${{ secrets.DROPBOX_ADMIN_USER_ID }}
          DROPBOX_TEMPLATE_ID=${{ secrets.DROPBOX_TEMPLATE_ID }}
          LOG_LEVEL=INFO
          EOF

      - name: Poll Dropbox and detect changes
        id: poll_dropbox
        run: |
          echo "🔍 Polling Dropbox for file changes (time range: ${TIME_RANGE})..."
          
          # Run main.py as a module with time-based processing to detect files
          python -m event_processing.main --time "${TIME_RANGE}" > poll_results.log 2>&1
          
          # Extract processed file information from logs
          echo "📊 Processing results..."
          grep -E "📄 시간 범위 내 파일:|파일 ID:|업로더:" poll_results.log || echo "No files found"
          
          # Count processed files
          PROCESSED_COUNT=$(grep -c "📄 시간 범위 내 파일:" poll_results.log || echo "0")
          echo "processed_count=${PROCESSED_COUNT}" >> $GITHUB_OUTPUT
          
          echo "✅ Polling completed. Found ${PROCESSED_COUNT} files."

      - name: Send results to domain
        if: steps.poll_dropbox.outputs.processed_count != '0'
        run: |
          echo "📤 Sending results to domain service..."
          
          # Parse log file and extract file information (with file_id and uploader info)
          # Expected log format (from main.py --time output):
          #   📄 시간 범위 내 파일: /path/to/file.pdf
          #   파일 ID: id:abc123xyz
          #   업로더: User Name (user@email.com)
          FILE_PATH=""
          FILE_ID=""
          UPLOADER_NAME=""
          UPLOADER_EMAIL=""
          
          while IFS= read -r line; do
            # Extract file path
            if [[ "$line" =~ "📄 시간 범위 내 파일: "(.+) ]]; then
              # If we have a previous file, send it first
              if [[ -n "$FILE_PATH" ]]; then
                BODY=$(jq -n \
                  --arg file_path "$FILE_PATH" \
                  --arg file_id "$FILE_ID" \
                  --arg uploader_name "$UPLOADER_NAME" \
                  --arg uploader_email "$UPLOADER_EMAIL" \
                  --arg repo "${{ github.repository }}" \
                  --arg branch "${{ github.ref_name }}" \
                  --arg commit "${{ github.sha }}" \
                  --arg actor "${{ github.actor }}" \
                  --argjson run_id ${{ github.run_id }} \
                  --arg time_range "${TIME_RANGE}" \
                  '{
                    job_type: "file_detected",
                    file_path: $file_path,
                    file_id: $file_id,
                    uploader_name: $uploader_name,
                    uploader_email: $uploader_email,
                    data: {
                      file_path: $file_path,
                      file_id: $file_id,
                      uploader_name: $uploader_name,
                      uploader_email: $uploader_email,
                      time_range: $time_range,
                      workflow_triggered: true
                    },
                    repo: $repo,
                    branch: $branch,
                    commit: $commit,
                    actor: $actor,
                    task_id: $run_id
                  }')
                
                RESPONSE=$(curl -sS -X POST "${WEBHOOK_URL}/enqueue" \
                  -H "Content-Type: application/json" \
                  -H "X-Workflow-Token: ${WORKFLOW_SHARED_SECRET}" \
                  -d "${BODY}" || echo '{"error":"failed"}')
                
                echo "Enqueued: $FILE_PATH (ID: $FILE_ID) - Uploader: $UPLOADER_NAME - Response: $RESPONSE"
              fi
              
              # Start new file entry
              FILE_PATH="${BASH_REMATCH[1]}"
              FILE_ID=""
              UPLOADER_NAME=""
              UPLOADER_EMAIL=""
            # Extract file ID
            elif [[ "$line" =~ "파일 ID: "(.+) ]]; then
              FILE_ID="${BASH_REMATCH[1]}"
            # Extract uploader info
            elif [[ "$line" =~ "업로더: "([^(]+)" \("([^)]+)"\)" ]]; then
              UPLOADER_NAME="${BASH_REMATCH[1]}"
              UPLOADER_EMAIL="${BASH_REMATCH[2]}"
            fi
          done < poll_results.log
          
          # Send last file if exists
          if [[ -n "$FILE_PATH" ]]; then
            BODY=$(jq -n \
              --arg file_path "$FILE_PATH" \
              --arg file_id "$FILE_ID" \
              --arg uploader_name "$UPLOADER_NAME" \
              --arg uploader_email "$UPLOADER_EMAIL" \
              --arg repo "${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg commit "${{ github.sha }}" \
              --arg actor "${{ github.actor }}" \
              --argjson run_id ${{ github.run_id }} \
              --arg time_range "${TIME_RANGE}" \
              '{
                job_type: "file_detected",
                file_path: $file_path,
                file_id: $file_id,
                uploader_name: $uploader_name,
                uploader_email: $uploader_email,
                data: {
                  file_path: $file_path,
                  file_id: $file_id,
                  uploader_name: $uploader_name,
                  uploader_email: $uploader_email,
                  time_range: $time_range,
                  workflow_triggered: true
                },
                repo: $repo,
                branch: $branch,
                commit: $commit,
                actor: $actor,
                task_id: $run_id
              }')
            
            RESPONSE=$(curl -sS -X POST "${WEBHOOK_URL}/enqueue" \
              -H "Content-Type: application/json" \
              -H "X-Workflow-Token: ${WORKFLOW_SHARED_SECRET}" \
              -d "${BODY}" || echo '{"error":"failed"}')
            
            echo "Enqueued: $FILE_PATH (ID: $FILE_ID) - Uploader: $UPLOADER_NAME - Response: $RESPONSE"
          fi
          
          echo "✅ Results sent to domain"

      - name: Upload poll results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poll-results-${{ github.run_id }}
          path: poll_results.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time Range**: ${TIME_RANGE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Processed**: ${{ steps.poll_dropbox.outputs.processed_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recent Log Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 poll_results.log >> $GITHUB_STEP_SUMMARY || echo "No log file available"
          echo '```' >> $GITHUB_STEP_SUMMARY