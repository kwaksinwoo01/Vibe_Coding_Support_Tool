name: Word Editor Tests

on:
  push:
    branches: [main]
    paths:
      - "word_editor/**"
      - ".github/workflows/word-editor-tests.yml"
  pull_request:
    paths:
      - "word_editor/**"
      - ".github/workflows/word-editor-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: word_editor/pyproject.toml
      - name: Install Word editor test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".\word_editor[test]"
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .\word_editor\src
      - name: Run pure tests
        shell: pwsh
        run: python -m pytest .\word_editor\tests -q
