name: Document Completion Update Workflow

on:
  push:
    # Trigger only when Markdown files under docs_2/ change
    paths:
      - 'docs_2/**/*.md'
  workflow_dispatch:
    inputs:
      # Optional: process a specific file when manually dispatched
      file_path:
        description: 'Optional: path to a specific docs_2 Markdown file to process'
        required: false
        type: string
      # Version change type used by the document version updater tool
      change_type:
        description: 'Version change type'
        required: false
        default: 'detail'
        type: choice
        options:
          - medium
          - detail
          - user
      # When true, apply changes to files and commit them; otherwise dry-run
      apply_changes:
        description: 'Apply changes (if true, scripts will commit updates)'
        required: false
        default: false
        type: boolean

jobs:
  update-documents:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # fetch full history

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pathlib is part of Python standard library since 3.4
        # Only install if there are additional requirements in the future

    - name: Get changed files
      id: changed-files
      run: |
        if [ "${{ github.event_name }}" == "push" ]; then
          # For push events, detect added/modified markdown files under docs_2/
          # Use the range between before and after commit to capture multi-commit pushes
          CHANGED_FILES=$(git diff --diff-filter=AM --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^docs_2/.*\.md$' | tr '\n' ' ' | xargs || true)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.file_path }}" ]; then
          # Manual dispatch can pass a single file path
          # trim whitespace from the single file path
          echo "changed_files=$(echo '${{ inputs.file_path }}' | xargs)" >> $GITHUB_OUTPUT
        else
          # Default: operate on all Markdown files under docs_2/
          CHANGED_FILES=$(find docs_2 -name "*.md" | tr '\n' ' ' | xargs || true)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        fi

    - name: Run document update workflow
      env:
        CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
        CHANGE_TYPE: ${{ inputs.change_type }}
        APPLY_CHANGES: ${{ inputs.apply_changes }}
      run: |
        set -e

        # Use default value if CHANGE_TYPE is empty
        if [ -z "$CHANGE_TYPE" ]; then
          CHANGE_TYPE="detail"
        fi

        # Determine whether to apply changes (map to trigger_prd_update's --apply flag)
        if [ "$APPLY_CHANGES" = "true" ]; then
          APPLY_FLAG="--apply"
        else
          APPLY_FLAG=""
        fi

        # Build JSON payload for trigger_prd_update.py from CHANGED_FILES
        python - <<'PY'
        import os, json
        files = [f.strip() for f in os.environ.get('CHANGED_FILES','').split() if f.strip()]
        existing = [f for f in files if os.path.exists(f)]
        payload = {"wpd_sources": existing, "operations": []}
        with open('/tmp/doc_payload.json','w') as f:
            json.dump(payload, f, indent=2)
        print(f"Wrote /tmp/doc_payload.json with {len(existing)} files")
        PY

        HAS_FILES=$(python - <<'PY'
        import json
        p = json.load(open('/tmp/doc_payload.json'))
        print("1" if p.get('wpd_sources') else "0")
        PY
        )

        if [ "$HAS_FILES" = "1" ]; then
          python .github/agents/tool/scripts/trigger_prd_update.py --payload-file /tmp/doc_payload.json $APPLY_FLAG
        else
          echo "No existing changed WPD files to process. Skipping trigger_prd_update.py."
        fi

    - name: Commit and push changes (if any)
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs_2/
          git commit -m "docs: automatic document version & content updates - Applied version updates - Updated checklist and sections - Auto-updates by Document Completion Update Workflow"
          git push
        else
          echo "No changes to commit."
        fi