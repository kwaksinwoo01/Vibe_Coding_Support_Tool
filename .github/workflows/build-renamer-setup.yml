name: Build ReNamer Setup

on:
  workflow_dispatch:
  push:
    paths:
      - "renamer_setup/**"
      - ".github/workflows/build-renamer-setup.yml"
  pull_request:
    paths:
      - "renamer_setup/**"
      - ".github/workflows/build-renamer-setup.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: renamer_setup/pyproject.toml

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Install Python build dependencies
        shell: powershell
        working-directory: renamer_setup
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[build]"

      - name: Run unit tests
        shell: powershell
        working-directory: renamer_setup
        run: python -m pytest -q

      - name: Build classifier runtime
        shell: powershell
        working-directory: renamer_setup
        run: python -m PyInstaller --noconfirm classifier.spec

      - name: Compile NSIS installer
        shell: powershell
        working-directory: renamer_setup
        run: |
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found" }
          Push-Location installer
          try {
            & $makensis ReNamer_Setup.nsi
            if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed" }
          }
          finally {
            Pop-Location
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReNamer_Setup
          path: renamer_setup/dist/ReNamer_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload PascalScript source
        uses: actions/upload-artifact@v4
        with:
          name: ReNamer_PascalScript_7_2
          path: renamer_setup/renamer/renamer_document_classifier_7_2.txt
          if-no-files-found: error
          retention-days: 30
