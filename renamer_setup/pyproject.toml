[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renamer-document-classifier"
version = "7.4.1"
description = "Document classifier engine for ReNamer PDF and spreadsheet workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-calamine==0.8.2",
  "pypdf>=5,<6",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10,<7",
  "pytest>=8,<9",
]

[project.scripts]
renamer-document-classifier = "renamer_document_classifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
