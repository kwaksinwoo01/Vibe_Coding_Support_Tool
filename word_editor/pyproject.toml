[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-normal-style-editor"
version = "0.1.0"
description = "Live Normal.dotm style editor with validation and property-level merge"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "pywin32>=308; platform_system == 'Windows'",
  "watchdog>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
word-editor = "word_editor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
